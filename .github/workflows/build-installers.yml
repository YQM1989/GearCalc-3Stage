name: Build desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests and web build
        run: npm run check

      - name: Build DMG
        run: npm run tauri -- build --bundles dmg --ci --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: GearCalc-3Stage-0.1.0-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests and web build
        run: npm run check

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GearCalc-3Stage-0.1.0-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
